[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-software-engineering"
version = "1.0.0"
description = "Multi-Agent AI System for Autonomous Software Engineering: Converting Developer Requirements into Validated Code Changes"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Academic Research Team" }
]
dependencies = [
    "google-adk>=2.13.0",
    "google-genai>=2.34.0",
    "crewai>=1.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.40.0",
    "mcp>=1.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = [".", "sandbox_workspace/sample_repo"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
